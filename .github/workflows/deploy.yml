name: Deploy to GitHub Pages

on:
  # Dispara automaticamente quando você faz push
  push:
    branches: ["main", "master"]

  # Dispara em um horário agendado (Cron):
  # Exemplo: Todo dia às 00:00 e às 12:00 UTC (9h e 21h Horário de Brasília)
  schedule:
    - cron: "0 0,12 * * *"

  # Permite você disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Sync Notion Data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DADOS_DATABASE_ID: ${{ secrets.NOTION_DADOS_DATABASE_ID }}
          NOTION_CONTATO_DATABASE_ID: ${{ secrets.NOTION_CONTATO_DATABASE_ID }}
          NOTION_EXPERIENCIAS_DATABASE_ID: ${{ secrets.NOTION_EXPERIENCIAS_DATABASE_ID }}
          NOTION_STACKS_DATABASE_ID: ${{ secrets.NOTION_STACKS_DATABASE_ID }}
          NOTION_EDUCACAO_DATABASE_ID: ${{ secrets.NOTION_EDUCACAO_DATABASE_ID }}
        run: npm run sync:notion

      - name: Build with Next.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DADOS_DATABASE_ID: ${{ secrets.NOTION_DADOS_DATABASE_ID }}
          NOTION_CONTATO_DATABASE_ID: ${{ secrets.NOTION_CONTATO_DATABASE_ID }}
          NOTION_EXPERIENCIAS_DATABASE_ID: ${{ secrets.NOTION_EXPERIENCIAS_DATABASE_ID }}
          NOTION_STACKS_DATABASE_ID: ${{ secrets.NOTION_STACKS_DATABASE_ID }}
          NOTION_EDUCACAO_DATABASE_ID: ${{ secrets.NOTION_EDUCACAO_DATABASE_ID }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
