name: Deploy to GitHub Pages

on:
  # Dispara automaticamente quando você faz push
  push:
    branches: ["main", "master"]

  # Dispara em um horário agendado (Cron):
  # Exemplo: Todo dia às 00:00 e às 12:00 UTC (9h e 21h Horário de Brasília)
  schedule:
    - cron: "0 0,12 * * *"

  # Permite você disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Sync Notion Data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DADOS_DATABASE_ID: ${{ secrets.NOTION_DADOS_DATABASE_ID }}
          NOTION_CONTATO_DATABASE_ID: ${{ secrets.NOTION_CONTATO_DATABASE_ID }}
          NOTION_EXPERIENCIAS_DATABASE_ID: ${{ secrets.NOTION_EXPERIENCIAS_DATABASE_ID }}
          NOTION_STACKS_DATABASE_ID: ${{ secrets.NOTION_STACKS_DATABASE_ID }}
          NOTION_EDUCACAO_DATABASE_ID: ${{ secrets.NOTION_EDUCACAO_DATABASE_ID }}
        run: npm run sync:notion

      - name: Build with Next.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DADOS_DATABASE_ID: ${{ secrets.NOTION_DADOS_DATABASE_ID }}
          NOTION_CONTATO_DATABASE_ID: ${{ secrets.NOTION_CONTATO_DATABASE_ID }}
          NOTION_EXPERIENCIAS_DATABASE_ID: ${{ secrets.NOTION_EXPERIENCIAS_DATABASE_ID }}
          NOTION_STACKS_DATABASE_ID: ${{ secrets.NOTION_STACKS_DATABASE_ID }}
          NOTION_EDUCACAO_DATABASE_ID: ${{ secrets.NOTION_EDUCACAO_DATABASE_ID }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cleanup Old Deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = 'github-pages';
            const keepCount = 3;

            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner,
                repo,
                environment,
                per_page: 100,
              });

              console.log(`Encontrados ${deployments.length} deployments no ambiente ${environment}`);

              if (deployments.length > keepCount) {
                // Preserva os N primeiros (mais recentes) e deleta os mais antigos
                const toDelete = deployments.slice(keepCount);
                console.log(`Deletando ${toDelete.length} deployments antigos...`);

                for (const d of toDelete) {
                  try {
                    // Para deletar, o deployment precisa estar inativo
                    await github.rest.repos.createDeploymentStatus({
                      owner,
                      repo,
                      deployment_id: d.id,
                      state: 'inactive',
                    });

                    await github.rest.repos.deleteDeployment({
                      owner,
                      repo,
                      deployment_id: d.id,
                    });
                    console.log(`Deployment ${d.id} deletado com sucesso.`);
                  } catch (err) {
                    console.warn(`Não foi possível deletar o deployment ${d.id}:`, err.message);
                  }
                }
              }
            } catch (err) {
              console.warn('Aviso durante a limpeza de deployments:', err.message);
            }
